name: Build sito

# Quando arriva un nuovo articolo (o cambia il titolo/description di uno esistente),
# genera la card 1200x630 mancante, aggiorna i meta tag e gli script di tracciamento,
# poi committa il risultato sul branch.

on:
  push:
    branches: [main]
    paths:
      - 'articoli/**.html'
      - 'index.html'
      - 'assets/js/**'
      - 'tools/og_card.py'
      - 'tools/build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rigenera tutte le card, anche quelle già presenti'
        type: boolean
        default: false

permissions:
  contents: write

# Un run alla volta: i run in coda si accodano invece di spingere in parallelo.
concurrency:
  group: build-sito
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # gli script non devono lasciare in giro __pycache__
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Pillow e il font
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation

      - name: Genera le card mancanti
        run: python3 tools/og_card.py --prune ${{ inputs.force && '--force' || '' }}

      - name: Aggiorna i meta tag
        run: python3 tools/build.py

      - name: Committa se qualcosa è cambiato
        run: |
          git add assets/social assets/js index.html articoli
          if git diff --cached --quiet; then
            echo 'Nessuna anteprima da aggiornare.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna anteprime social'
          # un altro push potrebbe essere arrivato nel frattempo
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo '### Anteprime aggiornate' >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
